name: Testes

# Roda as suítes EditMode e PlayMode da Unity em todo PR para a main e a cada push na main.
# Precisa dos secrets UNITY_LICENSE, UNITY_EMAIL e UNITY_PASSWORD no repositório.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write   # o test-runner publica o resultado como check no PR

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes ${{ matrix.plataforma }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        plataforma: [editmode, playmode]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # A pasta Library guarda a importação dos assets; com cache, a importação não recomeça do zero
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.plataforma }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.plataforma }}-
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: testes
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.10f1
          testMode: ${{ matrix.plataforma }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Resultado ${{ matrix.plataforma }}
          artifactsPath: resultados-${{ matrix.plataforma }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-${{ matrix.plataforma }}
          path: ${{ steps.testes.outputs.artifactsPath }}
